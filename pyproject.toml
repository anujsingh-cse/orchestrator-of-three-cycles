[project]
name = "orchestrator-of-three-cycles"
version = "0.1.0"
description = "Research harness: does adversarial falsification produce measurably more robust patches than flat loops?"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "textual>=0.80",
]

[project.optional-dependencies]
nim = ["langchain-nvidia-ai-endpoints>=0.4"]
ollama = ["ollama>=0.4"]
openhands = ["openhands-sdk>=1.0"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: runs against the NVIDIA NIM free tier (needs NIM_API_KEY)",
]