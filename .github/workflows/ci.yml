name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Unit suite (mocked LLM, no key needed)
        run: uv run pytest -q

  prompt-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev
      - name: Prompt smoke evals (D13) - 5 cases per agent
        run: uv run python -m evals.prompt_smoke

  substrate-spike:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra openhands --group dev
      - name: LangGraph spike (D12)
        run: uv run python scripts/spike_langgraph.py
      - name: OpenHands spike (D12)
        run: uv run python scripts/spike_openhands.py

  integration-nim:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group dev
      - name: NIM-gated integration tests
        run: |
          if [ -z "$NIM_API_KEY" ]; then
            echo "NIM_API_KEY not set - skipping integration tests"
            exit 0
          fi
          uv run pytest -q -m integration
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}